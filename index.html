<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Name</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f4f4;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,.12);
            max-width: 700px;
            text-align: center;
        }

        h1 {
            margin-top: 0;
            color: #0366d6;
        }

        p {
            line-height: 1.6;
        }

        a {
            color: #0366d6;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        footer {
            margin-top: 30px;
            font-size: 0.9em;
            color: #777;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>Hello!</h1>

    <p>
        I'm <strong>Your Name</strong>.
    </p>

    <p>
        Welcome to my personal website. This page is hosted for free using
        GitHub Pages.
    </p>

    <p>
        I'll be adding projects, articles, and other content here soon.
    </p>

    <p>
        <a href="https://github.com/yourusername">GitHub</a>
    </p>

    <footer>
        © 2026 Your Name
    </footer>
</div>

</body>
</html>
